name: CI

# Runs on every push and pull request against main, plus a manual trigger.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check src/ main.py tests/ scripts/

      - name: Run unit tests with coverage
        run: pytest tests/ -v --cov=src --cov-report=term-missing

  pipeline-smoke-test:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic dataset
        run: python -m scripts.generate_sample_data.py

      - name: Run full pipeline end-to-end (S3 disabled, local MLflow)
        env:
          # Quality gates are intentionally loose here since this is a smoke
          # test on synthetic data, not a real training run.
          MLFLOW_TRACKING_URI: mlruns
        run: |
          python - <<'PY'
          import yaml
          with open("config/config.yaml") as f:
              cfg = yaml.safe_load(f)
          cfg["s3"]["enabled"] = False
          with open("config/config.yaml", "w") as f:
              yaml.safe_dump(cfg, f)
          PY
          python main.py --run-all

      - name: Upload MLflow run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-${{ github.run_id }}
          path: mlruns/
          retention-days: 7
