name: Scheduled Retrain

# Retrains the model on a schedule and lets the quality gates in
# config/config.yaml decide whether the new model gets registered.
# Runs against the REAL MLflow tracking server / S3 bucket (via secrets),
# unlike the CI smoke test which runs isolated on synthetic data.
on:
  schedule:
    # Every Monday at 06:00 UTC. Adjust to your retraining cadence.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this run was triggered manually"
        required: false
        default: "manual retrain"

jobs:
  retrain:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Pull latest raw data from S3
        env:
          RAW_DATA_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          mkdir -p data/raw
          aws s3 cp "s3://${RAW_DATA_BUCKET}/raw/raw_dataset.csv" data/raw/raw_dataset.csv

      - name: Run full pipeline (ingest -> train -> evaluate -> register)
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: python main.py --run-all

      - name: Notify on failure
        if: failure()
        run: echo "Retraining run failed — check the MLflow run logs and this job's output."
        # Replace with a real notification step (Slack webhook, email action, etc.)
