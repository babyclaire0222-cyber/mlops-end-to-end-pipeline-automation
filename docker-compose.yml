version: "3.9"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - mlflow-server

  mlflow-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mlflow
    volumes:
      - mlflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow-server:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    restart: unless-stopped
    depends_on:
      mlflow-db:
        condition: service_healthy
    expose:
      - "5000"
    command:
      - "--backend-store-uri=postgresql://mlflow:${POSTGRES_PASSWORD}@mlflow-db:5432/mlflow"
      - "--default-artifact-root=/mlartifacts"
      - "--serve-artifacts"
    volumes:
      - mlflow-artifacts:/mlartifacts

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mlflow-server
    environment:
      MLFLOW_TRACKING_URI: "http://mlflow-server:5000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
    command: ["--run-all"]

volumes:
  mlflow-db-data:
  mlflow-artifacts:
  caddy-data:
  caddy-config:
